<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Åstar Island — Living Norse World</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=JetBrains+Mono:wght@300;400;600&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0d13; overflow: hidden; font-family: 'JetBrains Mono', monospace; color: #c8cdd8; }

#hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px;
  background: linear-gradient(180deg, rgba(10,13,19,0.95) 0%, rgba(10,13,19,0) 100%);
  z-index: 10; pointer-events: none;
}
#hud > * { pointer-events: auto; }
#hud h1 {
  font-family: 'Cinzel', serif; font-size: 20px; font-weight: 900;
  letter-spacing: 3px;
  background: linear-gradient(135deg, #d4a647, #f0d080);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.hud-controls { display: flex; gap: 6px; }
.hud-btn {
  background: rgba(20,24,35,0.8); border: 1px solid rgba(212,166,71,0.3);
  color: #c8cdd8; padding: 8px 16px; font-family: inherit; font-size: 11px;
  cursor: pointer; border-radius: 4px; backdrop-filter: blur(10px);
  transition: all 0.2s; letter-spacing: 0.5px;
}
.hud-btn:hover { border-color: #d4a647; color: #d4a647; }
.hud-btn.active { background: rgba(212,166,71,0.15); border-color: #d4a647; color: #d4a647; }

#seed-indicator {
  position: fixed; left: 20px; bottom: 20px; z-index: 10;
}
#seed-indicator .label { color: #5a6275; font-size: 9px; letter-spacing: 1px; margin-bottom: 4px; }
.seed-pills { display: flex; gap: 4px; }
.seed-pill {
  width: 32px; height: 24px; display: flex; align-items: center; justify-content: center;
  background: rgba(20,24,35,0.8); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 4px; cursor: pointer; font-size: 10px; transition: all 0.2s;
}
.seed-pill:hover { border-color: #d4a647; }
.seed-pill.active { background: rgba(212,166,71,0.2); border-color: #d4a647; color: #d4a647; }

#cell-info {
  position: fixed; right: 20px; bottom: 20px;
  background: rgba(12,16,24,0.92); border: 1px solid rgba(212,166,71,0.2);
  padding: 16px; border-radius: 8px; min-width: 240px; max-width: 280px;
  backdrop-filter: blur(15px); z-index: 10; display: none;
}
#cell-info h4 { font-family: 'Cinzel', serif; font-size: 14px; margin-bottom: 8px; letter-spacing: 1px; }
.prob-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 10px; }
.prob-row .bar-bg { flex: 1; height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }
.prob-row .bar-fill { height: 100%; border-radius: 3px; }
.prob-row .pct { width: 36px; text-align: right; }

#stats-bar {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
  display: flex; gap: 16px; align-items: center;
  background: rgba(12,16,24,0.85); border: 1px solid rgba(212,166,71,0.15);
  padding: 8px 20px; border-radius: 20px; backdrop-filter: blur(10px);
  font-size: 10px;
}
.stat { display: flex; align-items: center; gap: 6px; }
.stat .icon { font-size: 14px; }
.stat .val { font-weight: 600; color: #d4a647; }

#loading {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; background: #0a0d13; z-index: 100;
}
#loading h1 { font-family: 'Cinzel', serif; font-size: 28px; letter-spacing: 6px; color: #d4a647; }
#loading p { font-size: 11px; color: #5a6275; margin-top: 12px; letter-spacing: 2px; }
#load-bar { width: 200px; height: 2px; background: #1e2433; margin-top: 20px; border-radius: 1px; overflow: hidden; }
#load-fill { width: 0%; height: 100%; background: #d4a647; transition: width 0.3s; }

canvas { display: block; cursor: grab; }
canvas:active { cursor: grabbing; }
</style>
</head>
<body>

<div id="loading">
  <h1>ÅSTAR ISLAND</h1>
  <p>BUILDING WORLD</p>
  <div id="load-bar"><div id="load-fill"></div></div>
</div>

<div id="hud">
  <h1>ÅSTAR ISLAND</h1>
  <div class="hud-controls">
    <button class="hud-btn active" data-view="terrain">Terrain</button>
    <button class="hud-btn" data-view="gt">Ground Truth</button>
    <button class="hud-btn" data-view="prediction">Prediction</button>
    <button class="hud-btn" data-view="error">Error Map</button>
  </div>
</div>

<div id="seed-indicator">
  <div class="label">SEED</div>
  <div class="seed-pills" id="seed-pills"></div>
</div>

<div id="stats-bar">
  <div class="stat"><span class="icon">⚔️</span><span id="n-sett">0</span> settlements</div>
  <div class="stat"><span class="icon">⛵</span><span id="n-port">0</span> ports</div>
  <div class="stat"><span class="icon">🌲</span><span id="n-forest">0</span> forest</div>
  <div class="stat"><span class="icon">🏔️</span><span id="n-mountain">0</span> mountains</div>
  <div class="stat"><span class="icon">👤</span><span id="n-people">0</span> vikings</div>
</div>

<div id="cell-info"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const CN = ['Empty','Settlement','Port','Ruin','Forest','Mountain'];
const CC = [0x8b9a6b, 0xc9453a, 0xd4913a, 0x6b5b73, 0x2d5a27, 0x5a5a6e];
const CCS = ['#8b9a6b','#c9453a','#d4913a','#6b5b73','#2d5a27','#5a5a6e'];

const TC = {
  10: { c: 0x1a3a5c, h: -0.12, n: 'Ocean' },
  11: { c: 0x94a474, h: 0.05, n: 'Plains' },
  0:  { c: 0x7a8960, h: 0.05, n: 'Empty' },
  1:  { c: 0xc9453a, h: 0.25, n: 'Settlement' },
  2:  { c: 0xd4913a, h: 0.22, n: 'Port' },
  3:  { c: 0x6b5b73, h: 0.10, n: 'Ruin' },
  4:  { c: 0x2d6a27, h: 0.08, n: 'Forest' },
  5:  { c: 0x6a6a7e, h: 0.7, n: 'Mountain' },
};

let data, scene, camera, renderer, controls;
let worldGroup, decorGroup, peopleGroup, particleGroup;
let people = [], birds = [], ships = [], smokeSystems = [];
let currentSeed = 0, viewMode = 'terrain';
let raycaster, mouse;
const W = 40, H = 40;

async function init() {
  setLoad(10);
  const resp = await fetch('viz_data.json');
  data = await resp.json();
  setLoad(30);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0d13);
  scene.fog = new THREE.FogExp2(0x1a2a3f, 0.008);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 300);
  camera.position.set(28, 32, 28);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.body.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 5;
  controls.maxDistance = 70;
  controls.maxPolarAngle = Math.PI / 2.15;
  controls.target.set(0, 0, 0);

  // Lighting — golden hour Norse atmosphere
  scene.add(new THREE.AmbientLight(0x4466aa, 0.35));
  const sun = new THREE.DirectionalLight(0xffeebb, 1.3);
  sun.position.set(25, 35, 15);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
  sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
  sun.shadow.bias = -0.001;
  scene.add(sun);
  scene.add(new THREE.DirectionalLight(0x6688cc, 0.25).translateX(-15).translateY(10).translateZ(-10));
  scene.add(new THREE.HemisphereLight(0x88aacc, 0x445533, 0.2));

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2(-999, -999);

  setLoad(50);
  buildWorld();
  setLoad(90);
  setupUI();
  setLoad(100);

  setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 500);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  renderer.domElement.addEventListener('click', onClick);

  animate();
}

function setLoad(pct) { document.getElementById('load-fill').style.width = pct + '%'; }

// ── World Builder ──────────────────────────────────────
function buildWorld() {
  if (worldGroup) scene.remove(worldGroup);
  if (decorGroup) scene.remove(decorGroup);
  if (peopleGroup) scene.remove(peopleGroup);
  if (particleGroup) scene.remove(particleGroup);

  worldGroup = new THREE.Group();
  decorGroup = new THREE.Group();
  peopleGroup = new THREE.Group();
  particleGroup = new THREE.Group();
  people = []; birds = []; ships = []; smokeSystems = [];

  const grid = data.initial_states[currentSeed].grid;
  const gt = data.analysis?.ground_truth;
  const pred = data.analysis?.prediction;
  const ox = -W / 2, oz = -H / 2;
  let nSett = 0, nPort = 0, nFor = 0, nMtn = 0;

  // Terrain height map with smoothing
  const hmap = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const code = grid[y][x];
    hmap[y * W + x] = (TC[code]?.h || 0.05);
    // Add noise
    hmap[y * W + x] += (Math.sin(x * 0.7) * Math.cos(y * 0.5)) * 0.03;
  }

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const code = grid[y][x];
      const cfg = TC[code] || TC[0];
      let h = hmap[y * W + x];
      let color = cfg.c;

      if (viewMode === 'gt' && gt) { color = blendC(gt[y][x]); h = 0.08 + ent(gt[y][x]) * 0.5; }
      else if (viewMode === 'prediction' && pred) { color = blendC(pred[y][x]); h = 0.08 + ent(pred[y][x]) * 0.5; }
      else if (viewMode === 'error' && gt && pred) {
        const k = kl(gt[y][x], pred[y][x]);
        const t = Math.min(k / 0.3, 1);
        color = new THREE.Color().setHSL(0.33 - t * 0.33, 0.8, 0.25 + t * 0.25).getHex();
        h = 0.05 + k * 1.5;
      }

      const bh = Math.max(h, 0.04);
      const geo = new THREE.BoxGeometry(0.96, bh, 0.96);
      const mat = new THREE.MeshStandardMaterial({
        color, roughness: code === 10 ? 0.15 : 0.75,
        metalness: code === 10 ? 0.35 : 0.02,
      });
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x + ox, bh / 2, y + oz);
      m.castShadow = code !== 10;
      m.receiveShadow = true;
      m.userData = { x, y, code };
      worldGroup.add(m);

      // Decorations (terrain view only)
      if (viewMode === 'terrain') {
        if (code === 4) { addTrees(x + ox, bh, y + oz); nFor++; }
        if (code === 5) { addMountain(x + ox, bh, y + oz); nMtn++; }
        if (code === 1) { addSettlement(x + ox, bh, y + oz); nSett++; spawnVikings(x + ox, bh, y + oz, 2); }
        if (code === 2) { addPort(x + ox, bh, y + oz); nPort++; spawnVikings(x + ox, bh, y + oz, 3); spawnShip(x + ox, y + oz, grid); }
        if (code === 3) { addRuin(x + ox, bh, y + oz); }
      }
    }
  }

  // Water plane
  const wg = new THREE.PlaneGeometry(80, 80, 40, 40);
  const wm = new THREE.MeshStandardMaterial({
    color: 0x1a4a6c, transparent: true, opacity: 0.7,
    roughness: 0.08, metalness: 0.4,
  });
  const water = new THREE.Mesh(wg, wm);
  water.rotation.x = -Math.PI / 2;
  water.position.y = -0.08;
  water.receiveShadow = true;
  worldGroup.add(water);

  // Spawn birds
  for (let i = 0; i < 12; i++) spawnBird();

  scene.add(worldGroup);
  scene.add(decorGroup);
  scene.add(peopleGroup);
  scene.add(particleGroup);

  // Update stats
  document.getElementById('n-sett').textContent = nSett;
  document.getElementById('n-port').textContent = nPort;
  document.getElementById('n-forest').textContent = nFor;
  document.getElementById('n-mountain').textContent = nMtn;
  document.getElementById('n-people').textContent = people.length;
}

// ── Decorations ────────────────────────────────────────
function addTrees(x, h, z) {
  const n = 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < n; i++) {
    const dx = (Math.random() - 0.5) * 0.5;
    const dz = (Math.random() - 0.5) * 0.5;
    const scale = 0.7 + Math.random() * 0.5;

    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.03 * scale, 0.05 * scale, 0.2 * scale, 5),
      new THREE.MeshStandardMaterial({ color: 0x5a3a20, roughness: 0.9 })
    );
    trunk.position.set(x + dx, h + 0.1 * scale, z + dz);
    trunk.castShadow = true;
    decorGroup.add(trunk);

    // Two layers of canopy
    for (let j = 0; j < 2; j++) {
      const canopy = new THREE.Mesh(
        new THREE.ConeGeometry(0.18 * scale * (1 - j * 0.3), 0.25 * scale, 6),
        new THREE.MeshStandardMaterial({ color: j === 0 ? 0x1a5a15 : 0x1e6a18, roughness: 0.8 })
      );
      canopy.position.set(x + dx, h + (0.25 + j * 0.15) * scale, z + dz);
      canopy.castShadow = true;
      decorGroup.add(canopy);
    }
  }
}

function addMountain(x, h, z) {
  const peak = new THREE.Mesh(
    new THREE.ConeGeometry(0.4, 0.7, 6),
    new THREE.MeshStandardMaterial({ color: 0x5a5a6e, roughness: 0.65, metalness: 0.05 })
  );
  peak.position.set(x, h + 0.35, z);
  peak.castShadow = true;
  decorGroup.add(peak);

  // Snow
  const snow = new THREE.Mesh(
    new THREE.ConeGeometry(0.15, 0.2, 6),
    new THREE.MeshStandardMaterial({ color: 0xdde0ee, roughness: 0.2, metalness: 0.1 })
  );
  snow.position.set(x, h + 0.7, z);
  decorGroup.add(snow);

  // Small rocks
  for (let i = 0; i < 3; i++) {
    const rock = new THREE.Mesh(
      new THREE.DodecahedronGeometry(0.06 + Math.random() * 0.06, 0),
      new THREE.MeshStandardMaterial({ color: 0x555566, roughness: 0.9 })
    );
    const a = Math.random() * Math.PI * 2;
    rock.position.set(x + Math.cos(a) * 0.35, h + 0.03, z + Math.sin(a) * 0.35);
    decorGroup.add(rock);
  }
}

function addSettlement(x, h, z) {
  // Main longhouse
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(0.35, 0.18, 0.22),
    new THREE.MeshStandardMaterial({ color: 0xbbaa77, roughness: 0.85 })
  );
  base.position.set(x, h + 0.09, z);
  base.castShadow = true;
  decorGroup.add(base);

  // Roof
  const roofGeo = new THREE.BufferGeometry();
  const s = 0.19, rh = 0.14;
  const verts = new Float32Array([
    -s, 0, -0.13,  s, 0, -0.13,  0, rh, -0.13,
    -s, 0, 0.13,   s, 0, 0.13,   0, rh, 0.13,
    -s, 0, -0.13,  -s, 0, 0.13,  0, rh, -0.13,
    0, rh, -0.13,  -s, 0, 0.13,  0, rh, 0.13,
    s, 0, -0.13,   s, 0, 0.13,   0, rh, -0.13,
    0, rh, -0.13,  s, 0, 0.13,   0, rh, 0.13,
  ]);
  roofGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  roofGeo.computeVertexNormals();
  const roof = new THREE.Mesh(roofGeo,
    new THREE.MeshStandardMaterial({ color: 0x8a5530, roughness: 0.8, side: THREE.DoubleSide })
  );
  roof.position.set(x, h + 0.18, z);
  roof.castShadow = true;
  decorGroup.add(roof);

  // Door
  const door = new THREE.Mesh(
    new THREE.PlaneGeometry(0.06, 0.10),
    new THREE.MeshStandardMaterial({ color: 0x3a2a15, side: THREE.DoubleSide })
  );
  door.position.set(x + 0.176, h + 0.05, z);
  door.rotation.y = Math.PI / 2;
  decorGroup.add(door);

  // Smoke
  addSmoke(x, h + 0.35, z);

  // Fence posts
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 + Math.random() * 0.5;
    const r = 0.35;
    const post = new THREE.Mesh(
      new THREE.CylinderGeometry(0.015, 0.015, 0.12, 4),
      new THREE.MeshStandardMaterial({ color: 0x5a4025 })
    );
    post.position.set(x + Math.cos(a) * r, h + 0.06, z + Math.sin(a) * r);
    decorGroup.add(post);
  }
}

function addPort(x, h, z) {
  addSettlement(x, h, z);

  // Dock
  const dock = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.04, 0.12),
    new THREE.MeshStandardMaterial({ color: 0x6a5030, roughness: 0.9 })
  );
  dock.position.set(x + 0.3, h - 0.05, z);
  dock.castShadow = true;
  decorGroup.add(dock);

  // Dock posts
  for (let i = 0; i < 3; i++) {
    const post = new THREE.Mesh(
      new THREE.CylinderGeometry(0.02, 0.02, 0.2, 4),
      new THREE.MeshStandardMaterial({ color: 0x4a3520 })
    );
    post.position.set(x + 0.1 + i * 0.2, h - 0.08, z + 0.06);
    decorGroup.add(post);
  }

  // Flag
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.01, 0.01, 0.5, 4),
    new THREE.MeshStandardMaterial({ color: 0x6a5530 })
  );
  pole.position.set(x - 0.15, h + 0.25, z - 0.15);
  decorGroup.add(pole);

  const flag = new THREE.Mesh(
    new THREE.PlaneGeometry(0.15, 0.1),
    new THREE.MeshStandardMaterial({ color: 0xcc2222, side: THREE.DoubleSide })
  );
  flag.position.set(x - 0.07, h + 0.45, z - 0.15);
  decorGroup.add(flag);
}

function addRuin(x, h, z) {
  for (let i = 0; i < 4; i++) {
    const dx = (Math.random() - 0.5) * 0.35;
    const dz = (Math.random() - 0.5) * 0.35;
    const block = new THREE.Mesh(
      new THREE.BoxGeometry(0.07 + Math.random() * 0.06, 0.04 + Math.random() * 0.08, 0.07 + Math.random() * 0.05),
      new THREE.MeshStandardMaterial({ color: 0x555566, roughness: 0.95 })
    );
    block.position.set(x + dx, h + 0.03, z + dz);
    block.rotation.set(Math.random() * 0.3, Math.random() * Math.PI, Math.random() * 0.2);
    block.castShadow = true;
    decorGroup.add(block);
  }
  // Overgrown moss
  const moss = new THREE.Mesh(
    new THREE.SphereGeometry(0.12, 6, 4),
    new THREE.MeshStandardMaterial({ color: 0x3a6a30, roughness: 0.9 })
  );
  moss.position.set(x + 0.1, h + 0.02, z - 0.05);
  moss.scale.y = 0.3;
  decorGroup.add(moss);
}

// ── Smoke particles ────────────────────────────────────
function addSmoke(x, y, z) {
  const particles = [];
  for (let i = 0; i < 8; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.02 + Math.random() * 0.02, 4, 4),
      new THREE.MeshStandardMaterial({ color: 0x888899, transparent: true, opacity: 0.4 })
    );
    p.position.set(x, y + Math.random() * 0.3, z);
    p.userData.vel = { x: (Math.random() - 0.5) * 0.002, y: 0.003 + Math.random() * 0.003, z: (Math.random() - 0.5) * 0.002 };
    p.userData.origin = { x, y, z };
    p.userData.life = Math.random();
    particleGroup.add(p);
    particles.push(p);
  }
  smokeSystems.push(particles);
}

// ── Vikings (people) ───────────────────────────────────
function spawnVikings(cx, h, cz, count) {
  for (let i = 0; i < count; i++) {
    const viking = createViking();
    const a = Math.random() * Math.PI * 2;
    const r = 0.15 + Math.random() * 0.3;
    viking.group.position.set(cx + Math.cos(a) * r, h, cz + Math.sin(a) * r);
    viking.target = { x: cx + (Math.random() - 0.5) * 0.8, z: cz + (Math.random() - 0.5) * 0.8 };
    viking.home = { x: cx, z: cz };
    viking.speed = 0.002 + Math.random() * 0.003;
    viking.walkTimer = Math.random() * 200;
    peopleGroup.add(viking.group);
    people.push(viking);
  }
}

function createViking() {
  const g = new THREE.Group();
  const skinColor = Math.random() > 0.5 ? 0xe8c8a0 : 0xd4aa78;
  const shirtColor = [0x8844, 0x884422, 0x336644, 0x553344, 0x445566][Math.floor(Math.random() * 5)];

  // Body
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.04, 0.05, 0.03),
    new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.8 })
  );
  body.position.y = 0.04;
  g.add(body);

  // Head
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.02, 6, 6),
    new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.7 })
  );
  head.position.y = 0.08;
  g.add(head);

  // Hair/helmet
  if (Math.random() > 0.4) {
    const hair = new THREE.Mesh(
      new THREE.SphereGeometry(0.022, 6, 4, 0, Math.PI * 2, 0, Math.PI * 0.6),
      new THREE.MeshStandardMaterial({ color: Math.random() > 0.5 ? 0x8a6a30 : 0x3a2a15 })
    );
    hair.position.y = 0.085;
    g.add(hair);
  } else {
    // Viking helmet
    const helmet = new THREE.Mesh(
      new THREE.SphereGeometry(0.024, 6, 4, 0, Math.PI * 2, 0, Math.PI * 0.5),
      new THREE.MeshStandardMaterial({ color: 0x777788, metalness: 0.5, roughness: 0.4 })
    );
    helmet.position.y = 0.088;
    g.add(helmet);
  }

  // Legs
  for (const side of [-1, 1]) {
    const leg = new THREE.Mesh(
      new THREE.BoxGeometry(0.015, 0.035, 0.015),
      new THREE.MeshStandardMaterial({ color: 0x554433 })
    );
    leg.position.set(side * 0.012, 0.013, 0);
    g.add(leg);
  }

  // Shield or axe (random)
  if (Math.random() > 0.6) {
    const shield = new THREE.Mesh(
      new THREE.CircleGeometry(0.018, 8),
      new THREE.MeshStandardMaterial({ color: 0xaa3333, side: THREE.DoubleSide })
    );
    shield.position.set(0.03, 0.04, 0);
    shield.rotation.y = Math.PI / 2;
    g.add(shield);
  }

  g.scale.set(1, 1, 1);
  g.castShadow = true;

  return { group: g, leftLeg: g.children[3], rightLeg: g.children[4], target: null, home: null, speed: 0.003, walkTimer: 0 };
}

// ── Birds ──────────────────────────────────────────────
function spawnBird() {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.03, 4, 4), bodyMat);
  g.add(body);

  const wingL = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 0.02), bodyMat);
  wingL.position.set(-0.04, 0, 0);
  g.add(wingL);

  const wingR = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 0.02), bodyMat);
  wingR.position.set(0.04, 0, 0);
  g.add(wingR);

  const a = Math.random() * Math.PI * 2;
  const r = 5 + Math.random() * 15;
  g.position.set(Math.cos(a) * r, 3 + Math.random() * 5, Math.sin(a) * r);
  g.userData = { angle: a, radius: r, height: g.position.y, speed: 0.002 + Math.random() * 0.005 };

  scene.add(g);
  birds.push(g);
}

// ── Ships ──────────────────────────────────────────────
function spawnShip(px, pz, grid) {
  // Find adjacent ocean
  const ox = -W / 2, oz = -H / 2;
  const gx = Math.round(px - ox), gy = Math.round(pz - oz);
  for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
    const nx = gx + dx, ny = gy + dy;
    if (nx >= 0 && nx < W && ny >= 0 && ny < H && grid[ny][nx] === 10) {
      const g = new THREE.Group();

      // Hull
      const hull = new THREE.Mesh(
        new THREE.BoxGeometry(0.35, 0.06, 0.1),
        new THREE.MeshStandardMaterial({ color: 0x6a4520, roughness: 0.8 })
      );
      g.add(hull);

      // Mast
      const mast = new THREE.Mesh(
        new THREE.CylinderGeometry(0.008, 0.008, 0.3, 4),
        new THREE.MeshStandardMaterial({ color: 0x5a3a15 })
      );
      mast.position.y = 0.15;
      g.add(mast);

      // Sail
      const sail = new THREE.Mesh(
        new THREE.PlaneGeometry(0.18, 0.18),
        new THREE.MeshStandardMaterial({ color: 0xddccaa, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
      );
      sail.position.set(0, 0.18, 0);
      g.add(sail);

      // Dragon head
      const dragonHead = new THREE.Mesh(
        new THREE.ConeGeometry(0.02, 0.06, 4),
        new THREE.MeshStandardMaterial({ color: 0xaa7733, roughness: 0.6 })
      );
      dragonHead.position.set(0.2, 0.04, 0);
      dragonHead.rotation.z = -Math.PI / 4;
      g.add(dragonHead);

      g.position.set(nx + ox, -0.01, ny + oz);
      g.userData = { baseY: -0.01, baseX: g.position.x };
      worldGroup.add(g);
      ships.push(g);
      return;
    }
  }
}

// ── Animation Loop ─────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  const t = performance.now() * 0.001;

  // Animate water vertices
  worldGroup.children.forEach(c => {
    if (c.userData?.code === 10) {
      c.position.y = (TC[10].h / 2) + Math.sin(t * 1.2 + c.position.x * 0.8 + c.position.z * 0.6) * 0.015;
    }
  });

  // Animate people
  people.forEach(v => {
    v.walkTimer++;
    if (v.walkTimer > 100 + Math.random() * 200) {
      v.walkTimer = 0;
      v.target = {
        x: v.home.x + (Math.random() - 0.5) * 0.8,
        z: v.home.z + (Math.random() - 0.5) * 0.8,
      };
    }
    if (v.target) {
      const dx = v.target.x - v.group.position.x;
      const dz = v.target.z - v.group.position.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist > 0.02) {
        v.group.position.x += (dx / dist) * v.speed;
        v.group.position.z += (dz / dist) * v.speed;
        v.group.rotation.y = Math.atan2(dx, dz);
        // Walk animation
        const bob = Math.sin(t * 8) * 0.005;
        v.group.position.y = v.group.position.y * 0.95 + (v.group.position.y + bob) * 0.05;
        if (v.leftLeg) v.leftLeg.rotation.x = Math.sin(t * 10) * 0.4;
        if (v.rightLeg) v.rightLeg.rotation.x = -Math.sin(t * 10) * 0.4;
      } else {
        if (v.leftLeg) v.leftLeg.rotation.x = 0;
        if (v.rightLeg) v.rightLeg.rotation.x = 0;
      }
    }
  });

  // Animate birds
  birds.forEach(b => {
    b.userData.angle += b.userData.speed;
    b.position.x = Math.cos(b.userData.angle) * b.userData.radius;
    b.position.z = Math.sin(b.userData.angle) * b.userData.radius;
    b.position.y = b.userData.height + Math.sin(t * 2 + b.userData.angle * 3) * 0.5;
    b.rotation.y = b.userData.angle + Math.PI / 2;
    // Wing flap
    if (b.children[1]) b.children[1].rotation.x = Math.sin(t * 6) * 0.5;
    if (b.children[2]) b.children[2].rotation.x = -Math.sin(t * 6) * 0.5;
  });

  // Animate ships
  ships.forEach(s => {
    s.position.y = s.userData.baseY + Math.sin(t * 0.8 + s.position.z) * 0.02;
    s.rotation.z = Math.sin(t * 0.6 + s.position.x) * 0.05;
  });

  // Animate smoke
  smokeSystems.forEach(particles => {
    particles.forEach(p => {
      p.userData.life += 0.008;
      if (p.userData.life > 1) {
        p.userData.life = 0;
        p.position.set(p.userData.origin.x, p.userData.origin.y, p.userData.origin.z);
        p.material.opacity = 0.4;
        p.scale.set(1, 1, 1);
      }
      p.position.x += p.userData.vel.x + Math.sin(t + p.position.y * 5) * 0.0005;
      p.position.y += p.userData.vel.y;
      p.position.z += p.userData.vel.z;
      p.material.opacity = 0.4 * (1 - p.userData.life);
      const s = 1 + p.userData.life * 2;
      p.scale.set(s, s, s);
    });
  });

  renderer.render(scene, camera);
}

// ── Interaction ────────────────────────────────────────
function onClick(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(worldGroup.children);
  if (hits.length > 0 && hits[0].object.userData.code !== undefined) {
    showCellInfo(hits[0].object.userData);
  }
}

function showCellInfo(ud) {
  const { x, y, code } = ud;
  const cfg = TC[code] || {};
  const info = document.getElementById('cell-info');
  let html = `<h4 style="color:#${(cfg.c||0xcccccc).toString(16).padStart(6,'0')}">${cfg.n || '?'}</h4>`;
  html += `<div style="font-size:10px;color:#5a6275;margin-bottom:8px">(${x}, ${y})</div>`;

  const gt = data.analysis?.ground_truth;
  const pred = data.analysis?.prediction;

  if (gt) {
    html += '<div style="font-size:9px;color:#5a6275;margin-bottom:4px">GROUND TRUTH</div>';
    for (let c = 0; c < 6; c++) if (gt[y][x][c] > 0.005) {
      const p = (gt[y][x][c] * 100).toFixed(1);
      html += `<div class="prob-row"><span style="width:36px;color:${CCS[c]}">${CN[c].slice(0,4)}</span><div class="bar-bg"><div class="bar-fill" style="width:${p}%;background:${CCS[c]}"></div></div><span class="pct">${p}%</span></div>`;
    }
  }
  if (pred) {
    html += '<div style="font-size:9px;color:#5a6275;margin:8px 0 4px">OUR PREDICTION</div>';
    for (let c = 0; c < 6; c++) if (pred[y][x][c] > 0.005) {
      const p = (pred[y][x][c] * 100).toFixed(1);
      html += `<div class="prob-row"><span style="width:36px;color:${CCS[c]}">${CN[c].slice(0,4)}</span><div class="bar-bg"><div class="bar-fill" style="width:${p}%;background:${CCS[c]}"></div></div><span class="pct">${p}%</span></div>`;
    }
  }
  if (gt && pred) {
    const k = kl(gt[y][x], pred[y][x]).toFixed(4);
    const e = ent(gt[y][x]).toFixed(3);
    html += `<div style="margin-top:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.08);font-size:10px">KL: ${k} · Entropy: ${e}</div>`;
  }
  info.innerHTML = html;
  info.style.display = 'block';
}

// ── Helpers ────────────────────────────────────────────
function blendC(p) {
  let r=0,g=0,b=0;
  for(let c=0;c<6;c++){r+=((CC[c]>>16)&0xff)*p[c];g+=((CC[c]>>8)&0xff)*p[c];b+=(CC[c]&0xff)*p[c];}
  return(Math.round(r)<<16)|(Math.round(g)<<8)|Math.round(b);
}
function ent(p){let h=0;for(const v of p)if(v>1e-8)h-=v*Math.log2(v);return h/Math.log2(6);}
function kl(p,q){let k=0;for(let i=0;i<6;i++)if(p[i]>1e-8)k+=p[i]*Math.log(p[i]/Math.max(q[i],1e-10));return k;}

// ── UI Setup ───────────────────────────────────────────
function setupUI() {
  const pills = document.getElementById('seed-pills');
  for (let i = 0; i < data.initial_states.length; i++) {
    const p = document.createElement('div');
    p.className = `seed-pill${i===0?' active':''}`;
    p.textContent = i + 1;
    p.onclick = () => { currentSeed = i; document.querySelectorAll('.seed-pill').forEach(e=>e.classList.remove('active')); p.classList.add('active'); buildWorld(); };
    pills.appendChild(p);
  }
  document.querySelectorAll('.hud-btn[data-view]').forEach(btn => {
    btn.onclick = () => { viewMode = btn.dataset.view; document.querySelectorAll('.hud-btn[data-view]').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); buildWorld(); };
  });
}

init();
</script>
